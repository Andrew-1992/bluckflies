# Adds Caddy in front of the app: HTTPS on ports 80/443 with automatic certificates.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.caddy.yml up -d --build
#
# Needs SITE_DOMAIN in .env (e.g. bluckflies.com) with its DNS A record pointing
# at this server, and ports 80 and 443 open in the firewall.

services:
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
